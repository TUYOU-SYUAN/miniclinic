<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #14B8A6; padding-bottom: 12px; }
        h1 { color: #0F2443; margin: 0; }
        .logout-form { margin: 0; display: inline-block; } /* Added display: inline-block for better alignment */
        .logout-form button { background: #94A3B8; color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 24px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
        .status-BOOKED    { color: #F59E0B; font-weight: bold; }
        .status-COMPLETED { color: #10B981; font-weight: bold; }
        .status-CANCELLED { color: #94A3B8; }
        .alert { background: #FEE2E2; color: #991B1B; padding: 12px; border-radius: 4px; margin-bottom: 16px; }
        .success { background: #D1FAE5; color: #065F46; padding: 12px; border-radius: 4px; margin-bottom: 16px; }
        .cancel-button {
            background: #EF4444; color: white; padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8em;
        }
        .cancel-button:hover { background: #DC2626; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Dashboard</h1>
            <p>歡迎，<span th:text="${doctor.name}"></span>（<span th:text="${doctor.department.name}"></span>）</p>
        </div>
        <form class="logout-form" th:action="@{/logout}" method="post">
            <button type="submit">登出</button>
        </form>
        <a th:href="@{/password}" style="margin-left: 15px; text-decoration: none; color: #0F2443; font-weight: bold;">修改密碼</a>
    </header>
    <div class="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <h2 th:text="|掛號日期：${displayDate}|"></h2>

    <form th:action="@{/dashboard}" method="get" style="margin-bottom: 20px;">
        <label for="datePicker">選擇日期：</label>
        <input type="date" id="datePicker" name="date" th:value="${displayDate}" onchange="this.form.submit()">
        <!-- <button type="submit">查詢</button> -->
    </form>


    <p th:if="${appointments.isEmpty()}">今日沒有掛號。</p>

    <table th:unless="${appointments.isEmpty()}">
        <thead>
            <tr>
                <th>時段</th>
                <th>病患</th>
                <th>病患ID</th>
                <th>狀態</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="appt : ${appointments}">
                <td th:text="${appt.appointmentTime}">AM</td>
                <td th:text="${appt.patient.name}">測試病患甲</td>
                <td th:text="${appt.patient.id}">TEST00001</td>
                <td>
                    <span th:text="${appt.status}"
                          th:class="${'status-' + appt.status}">BOOKED</span>
                    <button th:if="${appt.status == 'BOOKED'}"
                            class="cancel-button"
                            th:onclick="|cancelAppointment('${appt.id}')|">取消</button>
                </td>
            </tr>
        </tbody>
    </table>
        <p style="text-align: center; margin-top: 20px;">
        <a th:href="@{/}">← 回首頁</a>
    </p>

    <script th:inline="javascript">
        /*<![CDATA[*/
        function cancelAppointment(appointmentId) {
            if (!confirm('確定要取消這筆掛號嗎？')) {
                return;
            }

            fetch('/api/appointments/' + appointmentId + '/status', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: 'CANCELLED' })
            })
            .then(response => {
                if (response.ok) {
                    location.reload(); // 成功後重新整理頁面
                } else {
                    alert('取消失敗，請重試或聯繫管理員。');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('發生錯誤，請檢查網路連線。');
            });
        }
        /*]]>*/
    </script>
</body>
</html>
